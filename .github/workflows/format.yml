name: Format

# On pushes to main and devel, the Python code is formatted with ruff and the
# changes are committed to the branch. On pull requests, the formatting is only
# checked, since the workflow cannot push to branches of forks.

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.6"

      - name: Check the formatting
        if: github.event_name == 'pull_request'
        run: ruff format --check --diff .

      - name: Format the code
        if: github.event_name == 'push'
        run: ruff format .

      - name: Commit the formatted code
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Format the code with ruff"
            git push
          else
            echo "The code is already formatted."
          fi
